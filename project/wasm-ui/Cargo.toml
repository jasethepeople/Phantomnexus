[package]
name = "sentinel-ui"
version = "0.1.0"
edition = "2021"
description = "YouTube Sentinel - WebAssembly Dashboard UI"
authors = ["YouTube Sentinel Team"]
license = "MIT"
repository = "https://github.com/youtube-sentinel/sentinel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo = "0.11"
gloo-net = "0.5"
gloo-timers = "0.3"
gloo-events = "0.2"
gloo-utils = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["wasmbind"] }
uuid = { version = "1.6", features = ["js", "v4"] }
thiserror = "1.0"
log = "0.4"
wasm-logger = "0.2"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "File",
    "FileList",
    "FileReader",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "DragEvent",
    "Event",
    "EventTarget",
    "InputEvent",
    "UiEvent",
    "ProgressEvent",
    "CssStyleDeclaration",
    "DomTokenList",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
