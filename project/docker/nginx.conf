# =============================================================================
# YouTube Sentinel - Nginx Configuration
# =============================================================================
# Production nginx config serving:
#   1. WASM UI static files
#   2. Reverse proxy to Go API
#   3. WebSocket support for real-time updates
#   4. Rate limiting and security headers
#
# Usage:
#   nginx -c /etc/nginx/nginx.conf -t   # Test config
#   docker-compose up nginx              # Start service
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ================================================================
    # Basic Settings
    # ================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'rid=$request_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Connection and timeout settings
    keepalive_timeout 30s;
    keepalive_requests 1000;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ================================================================
    # MIME Types
    # ================================================================
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/wasm wasm;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg svgz;
        image/x-icon ico;
        application/pdf pdf;
        text/plain txt;
        application/xml xml;
        video/mp4 mp4;
        audio/mpeg mp3;
    }

    # ================================================================
    # Gzip Compression
    # ================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ================================================================
    # Rate Limiting
    # ================================================================
    # Per-IP rate limit for general requests
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;

    # Stricter rate limit for upload endpoints
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

    # Rate limit for API endpoints
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Rate limit status
    limit_req_status 429;
    limit_conn_status 503;

    # ================================================================
    # Upstream Definitions
    # ================================================================
    upstream api_backend {
        least_conn;
        server api:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream websocket_backend {
        server api:8080;
    }

    # ================================================================
    # Shared Zone for Real-time Data
    # ================================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ================================================================
    # Main Server Block
    # ================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Request ID for tracing
        add_header X-Request-ID $request_id always;

        # ============================================================
        # Security Headers
        # ============================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Strict Transport Security (enable when using HTTPS)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ============================================================
        # Health Check Endpoint
        # ============================================================
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /nginx_status {
            access_log off;
            allow 172.20.0.0/16;  # Internal network only
            deny all;
            stub_status on;
        }

        # ============================================================
        # WebSocket Endpoint (Real-time Updates)
        # ============================================================
        location /ws {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 10;

            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 7s;
            proxy_send_timeout 7s;
            proxy_read_timeout 86400s;

            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
        }

        # ============================================================
        # API Proxy (REST Endpoints)
        # ============================================================
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            limit_conn addr 50;

            proxy_pass http://api_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # CORS headers for API
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;

            # Handle preflight requests
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "$http_origin";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # ============================================================
        # Upload Endpoint (Stricter Limits)
        # ============================================================
        location /api/v1/upload {
            limit_req zone=upload burst=5 nodelay;
            limit_conn addr 5;

            client_max_body_size 500M;
            client_body_buffer_size 16k;
            client_body_temp_path /var/cache/nginx/client_temp;

            proxy_pass http://api_backend/v1/upload;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_request_buffering on;
            proxy_buffering off;

            # Upload progress tracking
            proxy_set_header X-File-Name $http_x_file_name;
            proxy_set_header X-File-Size $http_x_file_size;
        }

        # ============================================================
        # WASM Module Serving
        # ============================================================
        location /wasm/ {
            alias /usr/share/nginx/html/wasm/;
            add_header Content-Type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable" always;

            # Enable gzip for WASM
            gzip_static on;
        }

        # ============================================================
        # Static Assets (CSS, JS, Images)
        # ============================================================
        location /static/ {
            alias /usr/share/nginx/html/static/;

            # Aggressive caching for static assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                add_header Vary "Accept-Encoding" always;
                access_log off;
                expires 1y;
            }

            # HTML files - shorter cache
            location ~* \.html$ {
                add_header Cache-Control "public, max-age=3600, must-revalidate" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
            }
        }

        # ============================================================
        # SPA Fallback (Single Page Application routing)
        # ============================================================
        location / {
            limit_req zone=general burst=50 nodelay;

            try_files $uri $uri/ /index.html;

            # Serve index.html with no-cache for SPA routing
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                add_header Expires "0" always;
            }
        }

        # ============================================================
        # Error Pages
        # ============================================================
        error_page 400 401 402 403 404 405 406 407 408 409 /error.html;
        error_page 500 501 502 503 504 505 /error.html;

        location = /error.html {
            internal;
            root /usr/share/nginx/html;
            add_header Content-Type text/html;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to backup/config files
        location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
