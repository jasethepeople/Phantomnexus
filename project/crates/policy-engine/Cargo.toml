[package]
name = "policy-engine"
version = "0.1.0"
edition = "2021"
authors = ["YouTube Sentinel Team"]
description = "Rule-based and ML policy matching engine for YouTube Sentinel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/youtube-sentinel/sentinel"

[dependencies]
sentinel-core = { path = "../sentinel-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["rt", "sync", "macros"] }
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
regex = "1.10"
lazy_static = "1.4"
dashmap = "5.5"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
