[package]
name = "autofix"
version = "0.1.0"
edition = "2021"
description = "Content-aware auto-fix engine for YouTube Sentinel - precision video/audio remediation"
authors = ["YouTube Sentinel Team"]
license = "MIT OR Apache-2.0"

[dependencies]
# Internal workspace crate
sentinel-core = { path = "../sentinel-core" }

# Async runtime
tokio = { version = "1.35", features = ["full", "process", "fs"] }

# Image processing
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
imageproc = { version = "0.23", default-features = false }

# Error handling
thiserror = "1.0"

# Unique IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# Logging/tracing
tracing = "0.1"

# Temp files
tempfile = "3.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Regex for text processing
regex = "1.10"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"
