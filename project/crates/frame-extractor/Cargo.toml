[package]
name = "frame-extractor"
version = "0.1.0"
edition = "2021"
authors = ["YouTube Sentinel Team"]
description = "Video frame extraction with FFmpeg, scene detection, and flash detection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/youtube-sentinel/sentinel"
build = "build.rs"

[dependencies]
# Internal dependencies
sentinel-core = { path = "../sentinel-core" }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# FFmpeg bindings
ffmpeg-next = "7.1"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "rgb"] }

# Error handling
thiserror = "1.0"

# Unique identifiers
uuid = { version = "1.9", features = ["v4", "serde"] }

# Logging and tracing
tracing = "0.1"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"

[features]
default = []
gpu = []

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"
