[package]
name = "synthesis"
version = "0.1.0"
edition = "2021"
authors = ["YouTube Sentinel Team"]
description = "Contextual AI synthesis and multi-modal data fusion for content understanding"
license = "MIT OR Apache-2.0"
repository = "https://github.com/youtube-sentinel/sentinel"

[dependencies]
# Internal dependencies
sentinel-core = { path = "../sentinel-core" }
analysis-engine = { path = "../analysis-engine" }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Error handling
thiserror = "1.0"

# Unique identifiers
uuid = { version = "1.9", features = ["v4", "serde"] }

# Logging and tracing
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "synthesis"
crate-type = ["lib", "cdylib"]
