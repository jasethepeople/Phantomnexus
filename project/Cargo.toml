[workspace]
members = [
    "crates/sentinel-core",
    "crates/frame-extractor",
    "crates/analysis-engine",
    "crates/policy-engine",
    "crates/synthesis",
    "crates/autofix",
    "crates/grpc-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["YouTube Sentinel Team"]
license = "MIT"
repository = "https://github.com/youtube-sentinel/sentinel"

[workspace.dependencies]
sentinel-core = { path = "crates/sentinel-core" }
frame-extractor = { path = "crates/frame-extractor" }
analysis-engine = { path = "crates/analysis-engine" }
policy-engine = { path = "crates/policy-engine" }
synthesis = { path = "crates/synthesis" }
autofix = { path = "crates/autofix" }
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
